name: Scrape Google Maps Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer with Stealth Plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: node scripts/scrape-profile.js

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-debug
          path: |
            debug-screenshots/
            src/data/profile.json
          retention-days: 7

      - name: Check scrape result
        run: |
          if [ -f src/data/profile.json ]; then
            echo "Profile data:"
            cat src/data/profile.json

            # Check if scraping was successful
            SUCCESS=$(node -e "const d = require('./src/data/profile.json'); console.log(d.scrapedSuccessfully || false)")
            echo "Scrape successful: $SUCCESS"

            if [ "$SUCCESS" != "true" ]; then
              echo "::warning::Scraping did not extract data successfully. Check debug artifacts."
            fi
          else
            echo "::error::profile.json not found!"
            exit 1
          fi

      - name: Commit and push if changed
        if: steps.scrape.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/profile.json
          git diff --staged --quiet || git commit -m "chore: Update profile data [skip ci]"
          git push
