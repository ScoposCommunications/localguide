name: Scrape Google Maps Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run scraper
        run: node scripts/scrape-profile.js
        continue-on-error: true

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-debug
          path: |
            src/data/profile.json
            debug-screenshot.png
          retention-days: 7

      - name: Show scrape results
        run: |
          echo "=== Profile Data ==="
          cat src/data/profile.json || echo "No profile.json found"

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/profile.json
          git diff --staged --quiet || git commit -m "chore: Update profile data [skip ci]"
          git push
